services:
  learnsphere:
    image: ${LEARN_SPHERE_IMAGE:-learnsphere:local}
    container_name: learnsphere
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
